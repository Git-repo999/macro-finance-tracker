// ---- Loan calculations ----
// Reducing-balance model:
//   - rate is MONTHLY interest %.
//   - principalPayments reduce the outstanding principal.
//   - interestPayments track the monthly interest the borrower pays.
//   - Monthly interest due is calculated on the CURRENT outstanding principal.
const MS_DAY = 1000 * 60 * 60 * 24;

// A principal repayment made within this many days of a cycle's start counts toward THAT
// cycle's interest. If it lands later in the cycle, that cycle still charges interest on the
// old balance and the reduction applies from the next cycle onwards.
const PRINCIPAL_GRACE_DAYS = 10;

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d;
}

// Add whole calendar months to a date, keeping the same day-of-month.
// If the target month is shorter (e.g. Jan 31 + 1mo), it clamps to the last day of that month.
function addMonths(dateStr, months) {
  const d = new Date(dateStr);
  const targetDay = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + months);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(targetDay, lastDay));
  return d;
}

// Build a month-by-month (calendar-month cycle) interest ledger for a loan.
// A cycle runs from the same day-of-month to the next month's same day, regardless of
// whether the month has 28/30/31 days. Interest accrues on the outstanding principal
// during that cycle, and interest payments waterfall across cycles in date order.
function buildInterestSchedule(loan) {
  const principal = Number(loan.principal) || 0;
  const rate = Number(loan.rate) || 0; // monthly %
  if (!loan.startDate) return { cycles: [], totalDue: 0, totalPaid: 0, advance: 0 };

  const now = new Date();

  // Count completed calendar-month cycles: increment months until the next boundary passes today.
  let cyclesElapsed = 0;
  while (addMonths(loan.startDate, cyclesElapsed + 1) <= now) {
    cyclesElapsed++;
  }

  // Principal repayments sorted by date, used to compute outstanding principal per cycle.
  const pPays = (loan.principalPayments || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));

  // Outstanding principal on/before a given date = original minus principal repaid up to that date (inclusive).
  // Compares by YYYY-MM-DD strings to avoid time-of-day/timezone edge cases.
  function outstandingAt(dateObj) {
    const cutoff = dateObj.toISOString().split('T')[0];
    let repaid = 0;
    pPays.forEach(p => { if (p.date <= cutoff) repaid += Number(p.amount) || 0; });
    return Math.max(principal - repaid, 0);
  }

  // Build cycles (each = one calendar month from start).
  // A cycle's interest uses the principal outstanding as of PRINCIPAL_GRACE_DAYS after the cycle
  // started. So a repayment made early in the month (within the grace window) reduces that same
  // month's interest, while one made later only takes effect from the next month.
  // (e.g. cycle 12 Apr -> 12 May, grace to 22 Apr: a 9 May repayment is too late, so that month
  //  charges 3% of 500000 and the 12 May -> 12 Jun month charges 3% of 300000. Had the repayment
  //  landed on 18 Apr, the 12 Apr -> 12 May month itself would charge 3% of 300000.)
  const cycles = [];
  for (let i = 0; i < cyclesElapsed; i++) {
    const cycleStart = addMonths(loan.startDate, i);
    const cycleEnd = addMonths(loan.startDate, i + 1);
    const graceCutoff = addDays(cycleStart.toISOString().split('T')[0], PRINCIPAL_GRACE_DAYS);
    const outstanding = outstandingAt(graceCutoff);
    const due = outstanding * (rate / 100);
    cycles.push({
      index: i + 1,
      start: cycleStart.toISOString().split('T')[0],
      end: cycleEnd.toISOString().split('T')[0],
      outstanding, due, paid: 0, payments: []
    });
  }

  // Pure date-ordered waterfall: process each interest payment in date order and use it to
  // fill the OLDEST unpaid month's due first, cascading to later months. Each chunk is listed
  // under the month it actually settled, so a payment can be split across months.
  const iPays = (loan.interestPayments || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  cycles.forEach(cy => { cy.paid = 0; cy.payments = []; });
  let advance = 0;              // net advance remaining (after covering all elapsed dues)
  const paymentAdvance = {};    // per-payment: amount of THIS installment that was paid ahead of what was due

  iPays.forEach(p => {
    let remaining = Number(p.amount) || 0;
    // 1) Cover older pending months AND the CURRENT month (the cycle the payment date falls in).
    //    A cycle is a current/past obligation if the payment was made after that cycle STARTED.
    //    Only cycles that start on/after the payment date are "future" -> that portion is advance.
    //    So a payment is advance only once the current month's own interest is fully covered.
    for (let c = 0; c < cycles.length && remaining > 0.0001; c++) {
      const isFuture = cycles[c].start > p.date;  // cycle starts strictly after the payment date
      if (isFuture) break;
      const gap = cycles[c].due - cycles[c].paid;
      if (gap <= 0.0001) continue;
      const applied = Math.min(gap, remaining);
      cycles[c].paid += applied;
      cycles[c].payments.push({ date: p.date, amount: applied, note: p.note, id: p.id });
      remaining -= applied;
    }
    // 2) Whatever is left is paid ahead — this installment's advance portion.
    if (remaining > 0.0001) paymentAdvance[p.id] = remaining;

    // 3) Apply that advance forward to future (not-yet-due) elapsed cycles for the ledger display.
    for (let c = 0; c < cycles.length && remaining > 0.0001; c++) {
      const gap = cycles[c].due - cycles[c].paid;
      if (gap <= 0.0001) continue;
      const applied = Math.min(gap, remaining);
      cycles[c].paid += applied;
      cycles[c].payments.push({ date: p.date, amount: applied, note: p.note, id: p.id, ahead: true });
      remaining -= applied;
    }
    if (remaining > 0.0001) advance += remaining; // beyond all elapsed months -> net advance credit
  });

  // Per-month "received" = sum of chunks that settled that month (for display).
  cycles.forEach(cy => { cy.received = cy.payments.reduce((s, x) => s + x.amount, 0); });

  // Per-payment PENDING: for each fully-elapsed month that ended short, attribute the shortfall
  // to the latest payment that was made for that month (so that installment's row shows what
  // was still pending for its month). Months whose due date hasn't passed yet aren't "pending".
  const todayStr = new Date().toISOString().split('T')[0];
  const paymentPending = {};
  cycles.forEach(cy => {
    const shortfall = cy.due - cy.paid;
    if (shortfall <= 0.01) return;             // fully paid (or overpaid via cascade)
    if (cy.end > todayStr) return;             // month not over yet -> not pending, just current
    // Find the latest payment (by date) that contributed to this month.
    if (cy.payments.length > 0) {
      const last = cy.payments.reduce((a, b) => (a.date >= b.date ? a : b));
      paymentPending[last.id] = (paymentPending[last.id] || 0) + shortfall;
    }
  });

  const totalDue = cycles.reduce((s, c) => s + c.due, 0);
  const totalPaid = (loan.interestPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return { cycles, totalDue, totalPaid, advance, paymentAdvance, paymentPending };
}

function calcLoan(loan) {
  const principal = Number(loan.principal) || 0;
  const rate = Number(loan.rate) || 0; // monthly %
  const principalPaid = (loan.principalPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const interestPaid = (loan.interestPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const outstandingPrincipal = Math.max(principal - principalPaid, 0);
  const monthlyInterest = outstandingPrincipal * (rate / 100);

  const sched = buildInterestSchedule(loan);
  const monthsElapsed = sched.cycles.length;
  const expectedInterest = sched.totalDue;
  const interestBalance = expectedInterest - interestPaid; // >0 pending, <0 advance
  const interestPending = Math.max(interestBalance, 0);
  const interestAdvance = Math.max(-interestBalance, 0);
  const overdue = interestPending > 0.01;
  const interestFullyPaid = expectedInterest > 0.01 && Math.abs(interestBalance) <= 0.01;

  return {
    principal, rate, principalPaid, interestPaid, outstandingPrincipal, monthlyInterest,
    monthsElapsed, expectedInterest, schedule: sched,
    interestBalance, interestPending, interestAdvance, interestFullyPaid, overdue,
    interestOutstanding: interestPending
  };
}

// ========================= LENDING TAB =========================
function renderLending() {
  const loans = state.finance.loans;
  const calcs = {};
  let totalPrincipal = 0, totalOutstanding = 0, totalInterestReceived = 0,
      totalMonthlyInterest = 0, totalInterestOverdue = 0;
  loans.forEach(l => {
    const c = calcLoan(l);
    calcs[l.id] = c;
    totalPrincipal += c.principal;
    totalOutstanding += c.outstandingPrincipal;
    totalInterestReceived += c.interestPaid;
    totalMonthlyInterest += c.monthlyInterest;
    totalInterestOverdue += c.interestOutstanding;
  });

  // What the borrowers still owe you in total: unpaid principal plus unpaid interest.
  const receivable = totalOutstanding + totalInterestOverdue;
  const clearedCount = loans.filter(l => calcs[l.id].outstandingPrincipal <= 0.01).length;
  const dueCount = loans.filter(l => calcs[l.id].overdue).length;
  const advCount = loans.filter(l => calcs[l.id].interestAdvance > 0.01).length;
  const today = new Date().toISOString().split('T')[0];

  // ===== Hero summary: one headline number, supporting figures below =====
  let html = `
    <div class="fin-hero">
      <div class="h-lbl">Total receivable</div>
      <div class="h-val" title="${fmtMoney(receivable)}">${fmtMoneyShort(receivable)}</div>
      <div class="h-sub">${loans.length - clearedCount} active · ${clearedCount} cleared${dueCount > 0 ? ' · <span style="color:var(--danger);font-weight:700;">' + dueCount + ' with dues</span>' : ''}</div>
      <div class="fin-tiles">
        <div class="fin-tile"><div class="t-val" style="color:var(--danger)" title="${fmtMoney(totalOutstanding)}">${fmtMoneyShort(totalOutstanding)}</div><div class="t-lbl">Principal out</div></div>
        <div class="fin-tile"><div class="t-val" style="color:${totalInterestOverdue > 0.01 ? 'var(--warning)' : 'var(--success)'}" title="${fmtMoney(totalInterestOverdue)}">${fmtMoneyShort(totalInterestOverdue)}</div><div class="t-lbl">Interest due</div></div>
        <div class="fin-tile"><div class="t-val" style="color:var(--carbs-c)" title="${fmtMoney(totalMonthlyInterest)}">${fmtMoneyShort(totalMonthlyInterest)}</div><div class="t-lbl">Per month</div></div>
        <div class="fin-tile"><div class="t-val" style="color:var(--success)" title="${fmtMoney(totalInterestReceived)}">${fmtMoneyShort(totalInterestReceived)}</div><div class="t-lbl">Interest earned</div></div>
        <div class="fin-tile"><div class="t-val" style="color:var(--fat-c)" title="${fmtMoney(totalPrincipal)}">${fmtMoneyShort(totalPrincipal)}</div><div class="t-lbl">Total lent</div></div>
      </div>
    </div>

    <div class="fin-sec-head">
      <h3>🤝 Loans</h3>
      <button class="fin-ghost-btn" onclick="toggleAddLoan()">${showAddLoan ? '✕ Cancel' : '＋ New loan'}</button>
    </div>`;

  // Add-loan form stays collapsed so the loan list is what you see first.
  if (showAddLoan) {
    html += `<div class="fin-panel">
      <div class="fin-form">
        <input type="text" id="loanBorrower" placeholder="Borrower name *">
        <input type="number" id="loanPrincipal" placeholder="Amount lent (₹) *" step="0.01" min="0">
        <input type="number" id="loanRate" placeholder="Monthly interest rate (%)" step="0.01" min="0">
        <input type="date" id="loanStart" value="${today}">
        <input type="text" id="loanNote" placeholder="Note (optional)">
      </div>
      <button class="btn btn-primary" onclick="addLoan()">💾 Save loan</button>
    </div>`;
  }

  if (loans.length === 0) {
    html += `<div class="fin-empty">
      <div class="e-icon">🤝</div>
      <div class="e-title">No loans yet</div>
      <div class="e-sub">Use “＋ New loan” above to start tracking money you have lent.</div>
    </div>`;
  } else {
    const filters = [
      ['all', 'All ' + loans.length],
      ['due', 'Dues ' + dueCount],
      ['advance', 'Advance ' + advCount],
      ['cleared', 'Cleared ' + clearedCount]
    ];
    html += `<div class="fin-filters">` + filters.map(([key, label]) =>
      `<button class="fin-filter ${loanFilter === key ? 'active' : ''}" onclick="setLoanFilter('${key}')">${label}</button>`
    ).join('') + `</div>`;

    const visible = loans.filter(l => {
      const c = calcs[l.id];
      if (loanFilter === 'due') return c.overdue;
      if (loanFilter === 'advance') return c.interestAdvance > 0.01;
      if (loanFilter === 'cleared') return c.outstandingPrincipal <= 0.01;
      return true;
    });

    if (visible.length === 0) {
      html += `<div class="fin-empty">
        <div class="e-icon">🔍</div>
        <div class="e-title">Nothing in this group</div>
        <div class="e-sub">Pick a different filter above.</div>
      </div>`;
    }

    visible.forEach(loan => {
      const c = calcs[loan.id];
      const settled = c.outstandingPrincipal <= 0.01;

      // Status drives both the badge and the card's left edge colour.
      let stateClass, badge;
      if (settled) {
        stateClass = 'is-cleared';
        badge = `<span class="status-badge status-ok">✔ Cleared</span>`;
      } else if (c.overdue) {
        stateClass = 'is-due';
        badge = `<span class="status-badge status-due">⚠ ${fmtMoney(c.interestPending)} interest due</span>`;
      } else if (c.interestAdvance > 0.01) {
        stateClass = 'is-adv';
        badge = `<span class="status-badge status-adv">＋ ${fmtMoney(c.interestAdvance)} advance</span>`;
      } else {
        stateClass = 'is-ok';
        badge = `<span class="status-badge status-ok">✔ Interest up to date</span>`;
      }

      const repaidPct = c.principal > 0 ? Math.min(c.principalPaid / c.principal * 100, 100) : 0;

      html += `<div class="loan-card ${stateClass}">
        <div class="loan-top">
          <div class="loan-avatar">${escapeHtml(initialsOf(loan.borrower))}</div>
          <div class="loan-id">
            <div class="loan-name">${escapeHtml(loan.borrower)} <span class="fin-chip">${c.rate}% / mo</span></div>
            <div class="loan-meta">Lent ${fmtMoney(c.principal)} on ${fmtDay(loan.startDate)}${loan.note ? ' · ' + escapeHtml(loan.note) : ''}</div>
          </div>
          <button class="icon-btn" title="Delete loan" aria-label="Delete loan for ${escapeHtml(loan.borrower)}" onclick="deleteLoan('${loan.id}')">🗑</button>
        </div>

        <div style="margin-top:10px;">${badge}</div>

        <div class="loan-progress">
          <div class="p-top"><span>Principal repaid</span><span>${fmtMoney(c.principalPaid)} of ${fmtMoney(c.principal)} · ${repaidPct.toFixed(0)}%</span></div>
          <div class="loan-bar"><span style="width:${repaidPct.toFixed(2)}%"></span></div>
        </div>

        <div class="loan-stats">
          <div class="loan-stat"><div class="s-val" style="color:var(--danger)">${fmtMoney(c.outstandingPrincipal)}</div><div class="s-lbl">Outstanding</div></div>
          <div class="loan-stat"><div class="s-val" style="color:var(--carbs-c)">${fmtMoney(c.monthlyInterest)}</div><div class="s-lbl">Interest / mo</div></div>
          <div class="loan-stat"><div class="s-val" style="color:var(--success)">${fmtMoney(c.interestPaid)}</div><div class="s-lbl">Interest received</div></div>
        </div>

        <div class="loan-actions">
          <button class="act-btn act-int" onclick="toggleFinSection('ipay-box-${loan.id}','')">＋ Interest payment</button>
          <button class="act-btn act-prin" onclick="toggleFinSection('ppay-box-${loan.id}','')">＋ Principal repayment</button>
        </div>

        <div id="ipay-box-${loan.id}" style="display:none;">
          <div class="fin-sub">
            <input type="date" id="ipay-date-${loan.id}" value="${today}">
            <input type="number" id="ipay-amt-${loan.id}" placeholder="Interest ₹" step="0.01" min="0" style="width:110px;">
            <input type="text" id="ipay-note-${loan.id}" placeholder="Note (optional)" style="min-width:120px;flex:1;">
            <button class="btn btn-success btn-sm" onclick="addPayment('${loan.id}','interest')">Save</button>
          </div>
        </div>

        <div id="ppay-box-${loan.id}" style="display:none;">
          <div class="fin-sub">
            <input type="date" id="ppay-date-${loan.id}" value="${today}">
            <input type="number" id="ppay-amt-${loan.id}" placeholder="Principal ₹" step="0.01" min="0" style="width:110px;">
            <input type="text" id="ppay-note-${loan.id}" placeholder="Note (optional)" style="min-width:120px;flex:1;">
            <button class="btn btn-success btn-sm" onclick="addPayment('${loan.id}','principal')">Save</button>
          </div>
        </div>`;

      const sched = c.schedule;

      // ===== Monthly ledger (collapsible) =====
      const ledgerId = `ledger-${loan.id}`, ledgerChev = `chev-l-${loan.id}`;
      const ledgerOpen = editingPayment && editingPayment.startsWith('interest-') &&
        (loan.interestPayments || []).some(p => `interest-${p.id}` === editingPayment);
      html += `<div class="fin-toggle" onclick="toggleFinSection('${ledgerId}','${ledgerChev}')">
        <span>📅 Monthly interest breakdown</span>
        <span class="chev" id="${ledgerChev}" style="transform:rotate(${ledgerOpen ? 90 : 0}deg)">▶</span>
      </div>
      <div id="${ledgerId}" style="display:${ledgerOpen ? 'block' : 'none'};">`;
      if (sched.cycles.length === 0) {
        html += `<div class="fin-muted">First month due ${fmtDay(addMonths(loan.startDate, 1).toISOString().split('T')[0])}.</div>`;
      } else {
        sched.cycles.slice().reverse().forEach(cy => {
          const due = cy.due;
          const covered = cy.paid;                       // how much of this month's due is settled
          const shortfall = Math.max(due - covered, 0);
          let pill;
          if (shortfall <= 0.01) pill = `<span class="pill pill-ok">✔ Paid</span>`;
          else if (covered > 0.01) pill = `<span class="pill pill-due">${fmtMoney(shortfall)} due (partial)</span>`;
          else pill = `<span class="pill pill-due">${fmtMoney(shortfall)} due</span>`;
          html += `<div class="month-row">
            <div>
              <div class="m-title">Month ${cy.index} ${pill}</div>
              <div class="fin-muted">${fmtDay(cy.start)} → ${fmtDay(cy.end)} · ${c.rate}% of ${fmtMoney(cy.outstanding)} = due ${fmtMoney(due)} · paid ${fmtMoney(covered)}</div>
              ${cy.payments.map(pp => `<div class="fin-muted" style="margin-top:2px;">• ${fmtDay(pp.date)}: <span class="fin-pos">${fmtMoney(pp.amount)}</span>${pp.note ? ' — ' + escapeHtml(pp.note) : ''}</div>`).join('')}
            </div>
          </div>`;
        });
        const totalInstallmentAdvance = Object.values(sched.paymentAdvance || {}).reduce((s, v) => s + v, 0);
        if (sched.advance > 0.01 || totalInstallmentAdvance > 0.01) {
          html += `<div class="month-row" style="background:rgba(96,165,250,0.08);display:block;">
            <div style="color:var(--fat-c);font-weight:700;">＋ Net advance credit ${fmtMoney(sched.advance)}</div>
            <div class="fin-muted" style="margin-top:2px;">Advance paid across installments: ${fmtMoney(totalInstallmentAdvance)}${sched.advance < totalInstallmentAdvance - 0.01 ? ' · part of it was later used to cover pending months' : ''}</div>
          </div>`;
        }
      }
      // Editable/deletable interest payment list inside the ledger section
      const iPays = (loan.interestPayments || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
      if (iPays.length > 0) {
        const payAdv = sched.paymentAdvance || {};
        const payPend = sched.paymentPending || {};
        html += `<div class="fin-muted" style="margin:8px 0 4px;">All interest payments (edit/remove)</div>
          <table class="fin-table"><tr><th>Date</th><th>Amount</th><th>Advance / Pending</th><th>Note</th><th></th></tr>`;
        iPays.forEach(p => {
          if (editingPayment === `interest-${p.id}`) {
            html += editRowHtml(loan.id, 'interest', p, 5);
          } else {
            const adv = payAdv[p.id] || 0;
            const pend = payPend[p.id] || 0;
            let apCell;
            if (adv > 0.01) apCell = '<span class="pill pill-adv">＋' + fmtMoney(adv) + ' advance</span>';
            else if (pend > 0.01) apCell = '<span class="pill pill-due">－' + fmtMoney(pend) + ' pending</span>';
            else apCell = '<span class="fin-muted">—</span>';
            html += `<tr>
              <td>${fmtDay(p.date)}</td>
              <td class="fin-pos">${fmtMoney(p.amount)}</td>
              <td>${apCell}</td>
              <td class="fin-muted">${p.note ? escapeHtml(p.note) : '—'}</td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="remove-btn" style="background:var(--fat-c);" title="Edit" onclick="startEditPayment('interest','${p.id}')">✎</button>
                <button class="remove-btn" title="Delete" onclick="deletePayment('${loan.id}','interest','${p.id}')">✕</button>
              </td>
            </tr>`;
          }
        });
        html += `</table>`;
      }
      html += `</div>`; // end ledger

      // ===== Principal repayments (collapsible) =====
      const prinId = `prin-${loan.id}`, prinChev = `chev-p-${loan.id}`;
      const prinOpen = editingPayment && editingPayment.startsWith('principal-') &&
        (loan.principalPayments || []).some(p => `principal-${p.id}` === editingPayment);
      html += `<div class="fin-toggle" onclick="toggleFinSection('${prinId}','${prinChev}')">
        <span>🏦 Principal repayments — repaid ${fmtMoney(c.principalPaid)}</span>
        <span class="chev" id="${prinChev}" style="transform:rotate(${prinOpen ? 90 : 0}deg)">▶</span>
      </div>
      <div id="${prinId}" style="display:${prinOpen ? 'block' : 'none'};">`;
      const pPays = (loan.principalPayments || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
      if (pPays.length === 0) {
        html += `<div class="fin-muted">No principal repayments yet.</div>`;
      } else {
        html += `<table class="fin-table"><tr><th>Date</th><th>Amount</th><th>Note</th><th></th></tr>`;
        pPays.forEach(p => {
          if (editingPayment === `principal-${p.id}`) {
            html += editRowHtml(loan.id, 'principal', p);
          } else {
            html += `<tr>
              <td>${fmtDay(p.date)}</td>
              <td class="fin-pos">${fmtMoney(p.amount)}</td>
              <td class="fin-muted">${p.note ? escapeHtml(p.note) : '—'}</td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="remove-btn" style="background:var(--fat-c);" title="Edit" onclick="startEditPayment('principal','${p.id}')">✎</button>
                <button class="remove-btn" title="Delete" onclick="deletePayment('${loan.id}','principal','${p.id}')">✕</button>
              </td>
            </tr>`;
          }
        });
        html += `</table>`;
      }
      html += `</div>`; // end principal

      html += `</div>`; // end loan card
    });
  }

  document.getElementById('fintab-lending').innerHTML = html;
}

function addLoan() {
  const borrower = document.getElementById('loanBorrower').value.trim();
  const principal = parseFloat(document.getElementById('loanPrincipal').value);
  const rate = parseFloat(document.getElementById('loanRate').value) || 0;
  const startDate = document.getElementById('loanStart').value;
  const note = document.getElementById('loanNote').value.trim();

  if (!borrower) { showToast('Borrower name is required', 'error'); return; }
  if (!principal || principal <= 0) { showToast('Enter a valid amount', 'error'); return; }

  state.finance.loans.push({
    id: finId(), borrower, principal, rate,
    startDate: startDate || new Date().toISOString().split('T')[0],
    note, interestPayments: [], principalPayments: []
  });
  saveState();
  renderLending();
  showToast(`Loan to ${borrower} added`);
}

function deleteLoan(id) {
  const loan = state.finance.loans.find(l => l.id === id);
  if (!loan) return;
  if (confirm(`Delete loan to "${loan.borrower}" and all its payment records?`)) {
    state.finance.loans = state.finance.loans.filter(l => l.id !== id);
    saveState();
    renderLending();
    showToast('Loan deleted');
  }
}

function addPayment(loanId, kind) {
  const loan = state.finance.loans.find(l => l.id === loanId);
  if (!loan) return;
  const prefix = kind === 'interest' ? 'ipay' : 'ppay';
  const date = document.getElementById(`${prefix}-date-${loanId}`).value;
  const amount = parseFloat(document.getElementById(`${prefix}-amt-${loanId}`).value);
  const noteEl = document.getElementById(`${prefix}-note-${loanId}`);
  const note = noteEl ? noteEl.value.trim() : '';
  if (!amount || amount <= 0) { showToast('Enter a valid payment amount', 'error'); return; }
  if (!date) { showToast('Select a payment date', 'error'); return; }

  if (kind === 'principal') {
    const c = calcLoan(loan);
    if (amount > c.outstandingPrincipal + 0.01) {
      showToast(`Amount exceeds outstanding principal (${fmtMoney(c.outstandingPrincipal)})`, 'error');
      return;
    }
    if (!loan.principalPayments) loan.principalPayments = [];
    loan.principalPayments.push({ id: finId(), date, amount, note });
  } else {
    if (!loan.interestPayments) loan.interestPayments = [];
    loan.interestPayments.push({ id: finId(), date, amount, note });
  }
  saveState();
  renderLending();
  const label = kind === 'interest' ? 'interest' : 'principal';
  showToast(`Recorded ${fmtMoney(amount)} ${label} from ${loan.borrower}`);
}

function deletePayment(loanId, kind, payId) {
  const loan = state.finance.loans.find(l => l.id === loanId);
  if (!loan) return;
  if (kind === 'interest') {
    loan.interestPayments = (loan.interestPayments || []).filter(p => p.id !== payId);
  } else {
    loan.principalPayments = (loan.principalPayments || []).filter(p => p.id !== payId);
  }
  saveState();
  renderLending();
}

// Track which payment row is currently being edited: `${kind}-${payId}` or null.
let editingPayment = null;

function startEditPayment(kind, payId) {
  editingPayment = `${kind}-${payId}`;
  renderLending();
}

function cancelEditPayment() {
  editingPayment = null;
  renderLending();
}

function saveEditPayment(loanId, kind, payId) {
  const loan = state.finance.loans.find(l => l.id === loanId);
  if (!loan) return;
  const list = kind === 'interest' ? (loan.interestPayments || []) : (loan.principalPayments || []);
  const p = list.find(x => x.id === payId);
  if (!p) return;

  const date = document.getElementById(`edit-date-${payId}`).value;
  const amount = parseFloat(document.getElementById(`edit-amt-${payId}`).value);
  const note = document.getElementById(`edit-note-${payId}`).value.trim();
  if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
  if (!date) { showToast('Select a date', 'error'); return; }

  if (kind === 'principal') {
    const otherRepaid = (loan.principalPayments || [])
      .filter(x => x.id !== payId)
      .reduce((s, x) => s + (Number(x.amount) || 0), 0);
    if (amount + otherRepaid > (Number(loan.principal) || 0) + 0.01) {
      showToast(`Total principal repaid would exceed the loan (${fmtMoney(loan.principal)})`, 'error');
      return;
    }
  }

  p.date = date;
  p.amount = amount;
  p.note = note;
  editingPayment = null;
  saveState();
  renderLending();
  showToast('Payment updated');
}

// Render an editable payment row (used inside the ledger + principal tables).
function editRowHtml(loanId, kind, p, colspan) {
  return `<tr>
    <td colspan="${colspan || 4}">
      <div class="fin-sub" style="margin:2px 0;">
        <input type="date" id="edit-date-${p.id}" value="${p.date}">
        <input type="number" id="edit-amt-${p.id}" value="${p.amount}" step="0.01" min="0" style="width:110px;">
        <input type="text" id="edit-note-${p.id}" value="${p.note ? escapeHtml(p.note) : ''}" placeholder="Note (optional)" style="min-width:120px;flex:1;">
        <button class="btn btn-success btn-sm" onclick="saveEditPayment('${loanId}','${kind}','${p.id}')">💾 Save</button>
        <button class="btn btn-danger btn-sm" onclick="cancelEditPayment()">✕</button>
      </div>
    </td>
  </tr>`;
}

// ========================= INVESTMENTS TAB =========================
function renderInvestments() {
  const inv = state.finance.investments;
  let totalInvested = 0, totalCurrent = 0;
  inv.forEach(i => { totalInvested += Number(i.invested) || 0; totalCurrent += Number(i.current) || 0; });
  const gain = totalCurrent - totalInvested;
  const gainPct = totalInvested > 0 ? (gain / totalInvested * 100) : 0;

  const gainColor = gain >= 0 ? 'var(--success)' : 'var(--danger)';
  const sign = gain >= 0 ? '+' : '';

  let html = `
    <div class="fin-hero">
      <div class="h-lbl">Portfolio value</div>
      <div class="h-val" title="${fmtMoney(totalCurrent)}">${fmtMoneyShort(totalCurrent)}</div>
      <div class="h-sub">Invested ${fmtMoney(totalInvested)} · <span style="color:${gainColor};font-weight:700;">${sign}${fmtMoney(gain)} (${sign}${gainPct.toFixed(1)}%)</span></div>
      <div class="fin-tiles">
        <div class="fin-tile"><div class="t-val" style="color:var(--fat-c)" title="${fmtMoney(totalInvested)}">${fmtMoneyShort(totalInvested)}</div><div class="t-lbl">Invested</div></div>
        <div class="fin-tile"><div class="t-val" style="color:var(--accent)" title="${fmtMoney(totalCurrent)}">${fmtMoneyShort(totalCurrent)}</div><div class="t-lbl">Current</div></div>
        <div class="fin-tile"><div class="t-val" style="color:${gainColor}" title="${fmtMoney(gain)}">${sign}${fmtMoneyShort(gain)}</div><div class="t-lbl">Gain / loss</div></div>
        <div class="fin-tile"><div class="t-val" style="color:${gainColor}">${sign}${gainPct.toFixed(1)}%</div><div class="t-lbl">Return</div></div>
      </div>
    </div>

    <div class="fin-sec-head">
      <h3>💼 Holdings</h3>
      <button class="fin-ghost-btn" onclick="toggleAddInvestment()">${showAddInvestment ? '✕ Cancel' : '＋ New holding'}</button>
    </div>`;

  if (showAddInvestment) {
    html += `<div class="fin-panel">
      <div class="fin-form">
        <input type="text" id="invName" placeholder="Fund / Stock name *">
        <select id="invType">
          <option value="Mutual Fund">Mutual Fund</option>
          <option value="Stock">Stock</option>
          <option value="ETF">ETF</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="invInvested" placeholder="Amount invested (₹) *" step="0.01" min="0">
        <input type="number" id="invCurrent" placeholder="Current value (₹)" step="0.01" min="0">
        <input type="text" id="invNote" placeholder="Note (optional)">
      </div>
      <button class="btn btn-primary" onclick="addInvestment()">💾 Save holding</button>
    </div>`;
  }

  if (inv.length === 0) {
    html += `<div class="fin-empty">
      <div class="e-icon">📈</div>
      <div class="e-title">No holdings yet</div>
      <div class="e-sub">Add a mutual fund, stock or ETF to track how it is doing.</div>
    </div>`;
  } else {
    // Largest holdings first, so the portfolio's weighting is obvious at a glance.
    const sorted = inv.slice().sort((a, b) => (Number(b.current) || 0) - (Number(a.current) || 0));
    sorted.forEach(i => {
      const invested = Number(i.invested) || 0;
      const current = Number(i.current) || 0;
      const g = current - invested;
      const gp = invested > 0 ? (g / invested * 100) : 0;
      const gc = g >= 0 ? 'var(--success)' : 'var(--danger)';
      const gs = g >= 0 ? '+' : '';
      const alloc = totalCurrent > 0 ? (current / totalCurrent * 100) : 0;

      html += `<div class="inv-card">
        <div class="inv-head">
          <div>
            <div class="inv-name">${escapeHtml(i.name)}</div>
            <div style="margin-top:5px;">
              <span class="fin-chip">${escapeHtml(i.type)}</span>
              <span class="fin-muted">${alloc.toFixed(1)}% of portfolio</span>
            </div>
            ${i.note ? '<div class="fin-muted" style="margin-top:5px;">' + escapeHtml(i.note) + '</div>' : ''}
          </div>
          <button class="icon-btn" title="Delete holding" aria-label="Delete ${escapeHtml(i.name)}" onclick="deleteInvestment('${i.id}')">🗑</button>
        </div>

        <div class="alloc-bar"><span style="width:${alloc.toFixed(2)}%"></span></div>

        <div class="inv-row">
          <div class="col"><div class="c-lbl">Invested</div><div class="c-val">${fmtMoney(invested)}</div></div>
          <div class="col"><div class="c-lbl">Gain / loss</div><div class="c-val" style="color:${gc}">${gs}${fmtMoney(g)} <span style="font-size:0.72rem;font-weight:600;">(${gs}${gp.toFixed(1)}%)</span></div></div>
          <div class="col"><div class="c-lbl">Current value</div>
            <input class="inv-input" type="number" value="${current}" step="0.01" title="Update current value"
              onchange="updateInvestmentValue('${i.id}', this.value)">
          </div>
        </div>
      </div>`;
    });
  }

  document.getElementById('fintab-investments').innerHTML = html;
}

function addInvestment() {
  const name = document.getElementById('invName').value.trim();
  const type = document.getElementById('invType').value;
  const invested = parseFloat(document.getElementById('invInvested').value);
  const current = parseFloat(document.getElementById('invCurrent').value);

  if (!name) { showToast('Name is required', 'error'); return; }
  if (!invested || invested <= 0) { showToast('Enter a valid invested amount', 'error'); return; }

  state.finance.investments.push({
    id: finId(), name, type, invested,
    current: (current && current > 0) ? current : invested,
    note: document.getElementById('invNote').value.trim()
  });
  saveState();
  renderInvestments();
  showToast(`Added ${name}`);
}

function updateInvestmentValue(id, value) {
  const item = state.finance.investments.find(i => i.id === id);
  if (!item) return;
  item.current = parseFloat(value) || 0;
  saveState();
  renderInvestments();
}

function deleteInvestment(id) {
  const item = state.finance.investments.find(i => i.id === id);
  if (!item) return;
  if (confirm(`Delete holding "${item.name}"?`)) {
    state.finance.investments = state.finance.investments.filter(i => i.id !== id);
    saveState();
    renderInvestments();
    showToast('Holding deleted');
  }
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ========== QUICK ADD ==========
function renderQuickAdd() {
  const quickFoods = getQuickAddFoods();
  if (quickFoods.length === 0) return '';
  let html = `<div class="card quick-add-section"><h3>⚡ Quick Add (Frequently Used)</h3><div class="quick-add-grid">`;
  quickFoods.forEach(f => {
    html += `<span class="quick-add-btn" style="display:inline-flex;align-items:center;gap:5px;">
      <span onclick="quickAddFood('${f.name.replace(/'/g,"\\'")}')" style="cursor:pointer">${f.name} (${f.cal} kcal)</span>
      <span onclick="hideQuickAdd('${f.name.replace(/'/g,"\\'")}')" style="cursor:pointer;color:#e74c3c;font-weight:bold;font-size:0.7rem;" title="Remove from Quick Add">✕</span>
    </span>`;
  });
  html += `</div></div>`;
  return html;
}

function getQuickAddFoods() {
  // Get hidden foods list
  const hidden = JSON.parse(localStorage.getItem('hiddenQuickAdd') || '[]');
  // Count how often each food appears across all daily logs
  const freq = {};
  Object.values(state.dailyLogs).forEach(log => {
    if (log.meals) {
      log.meals.forEach(meal => {
        meal.forEach(item => {
          freq[item.name] = (freq[item.name] || 0) + 1;
        });
      });
    }
  });
  // Sort by frequency, exclude hidden, return top 8
  return Object.entries(freq)
    .filter(([name]) => !hidden.includes(name))
    .sort((a,b) => b[1] - a[1])
    .slice(0, 8)
    .map(([name]) => state.foodDB.find(f => f.name === name))
    .filter(Boolean);
}

function hideQuickAdd(name) {
  const hidden = JSON.parse(localStorage.getItem('hiddenQuickAdd') || '[]');
  if (!hidden.includes(name)) {
    hidden.push(name);
    localStorage.setItem('hiddenQuickAdd', JSON.stringify(hidden));
  }
  renderDaily();
  showToast(`Removed "${name}" from Quick Add. Log it again to bring it back.`);
}

function unhideQuickAdd(name) {
  let hidden = JSON.parse(localStorage.getItem('hiddenQuickAdd') || '[]');
  hidden = hidden.filter(n => n !== name);
  localStorage.setItem('hiddenQuickAdd', JSON.stringify(hidden));
}

function quickAddFood(name) {
  selectedFood = state.foodDB.find(f => f.name === name);
  if (!selectedFood) return;
  document.getElementById('addFoodModal').classList.add('active');
  document.getElementById('modalFoodSearch').value = name;
  document.getElementById('modalQty').value = selectedFood.qty;
  document.getElementById('modalFoodPreview').textContent =
    `Per ${selectedFood.qty} ${selectedFood.unit}: ${selectedFood.cal} kcal | P:${selectedFood.protein}g | C:${selectedFood.carbs}g | F:${selectedFood.fat}g`;
  document.getElementById('modalSearchResults').style.display = 'none';
}

// ========== AUTO CALCULATE CALORIES ==========
function autoCalcCalories() {
  const protein = parseFloat(document.getElementById('nfProtein').value) || 0;
  const carbs = parseFloat(document.getElementById('nfCarbs').value) || 0;
  const fat = parseFloat(document.getElementById('nfFat').value) || 0;
  const cal = Math.round(protein * 4 + carbs * 4 + fat * 9);
  document.getElementById('nfCal').value = cal;
  document.getElementById('nfCalcHint').textContent = `Auto: ${protein}×4 + ${carbs}×4 + ${fat}×9 = ${cal} kcal`;
}

function autoCalcDirectCal() {
  const protein = parseFloat(document.getElementById('dlProtein').value) || 0;
  const carbs = parseFloat(document.getElementById('dlCarbs').value) || 0;
  const fat = parseFloat(document.getElementById('dlFat').value) || 0;
  const cal = Math.round(protein * 4 + carbs * 4 + fat * 9);
  document.getElementById('dlCal').value = cal;
  document.getElementById('dlCalcHint').textContent = `Auto: ${protein}×4 + ${carbs}×4 + ${fat}×9 = ${cal} kcal`;
}

// ========== DIRECT CALORIE LOG ==========
function openDirectLogModal() {
  document.getElementById('directLogModal').classList.add('active');
  ['dlName','dlProtein','dlCarbs','dlFat','dlCal'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('dlCalcHint').textContent = 'Calories auto-calculate from macros, or enter manually';
}

function closeDirectLogModal() {
  document.getElementById('directLogModal').classList.remove('active');
}

function saveDirectLog() {
  const name = document.getElementById('dlName').value.trim() || 'Manual entry';
  const mealIdx = parseInt(document.getElementById('dlMealSelect').value);
  const protein = parseFloat(document.getElementById('dlProtein').value) || 0;
  const carbs = parseFloat(document.getElementById('dlCarbs').value) || 0;
  const fat = parseFloat(document.getElementById('dlFat').value) || 0;
  let cal = parseFloat(document.getElementById('dlCal').value) || 0;

  if (cal === 0 && protein === 0 && carbs === 0 && fat === 0) {
    showToast('Enter at least calories or macros', 'error');
    return;
  }
  // If calories is 0 but macros exist, auto-calc
  if (cal === 0) { cal = Math.round(protein * 4 + carbs * 4 + fat * 9); }

  const entry = { name, qty: 1, unit: 'serving', protein, carbs, fat, cal, fibre: 0 };
  const log = getLog(state.currentDate);
  log.meals[mealIdx].push(entry);
  saveState();
  closeDirectLogModal();
  renderDaily();
  showToast(`Logged ${cal} kcal to Meal ${mealIdx + 1}`);
}

// ========== BACKUP REMINDER ==========
function renderBackupReminder() {
  const lastBackup = localStorage.getItem('lastBackupDate');
  const today = new Date().toISOString().split('T')[0];
  let daysSinceBackup = 0;
  if (lastBackup) {
    daysSinceBackup = Math.floor((new Date(today) - new Date(lastBackup)) / (1000*60*60*24));
  } else {
    daysSinceBackup = 999;
  }
  if (daysSinceBackup >= 7) {
    return `<div class="backup-banner">
      <span>⚠️ ${lastBackup ? 'Last backup: ' + daysSinceBackup + ' days ago' : 'No backup yet!'} — Export your data to stay safe.</span>
      <button class="btn btn-success btn-sm" onclick="doBackup()">📤 Backup Now</button>
    </div>`;
  }
  return '';
}

function doBackup() {
  exportData();
  localStorage.setItem('lastBackupDate', new Date().toISOString().split('T')[0]);
  renderDaily();
}

// Start the app
init();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}
